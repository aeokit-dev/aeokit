<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">aeokit identity system</title>
  <desc id="desc">A presentation sheet showing the modular K mark, primary wordmark, domain lockup, dark mode, monochrome, and small-size tests.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#111318" flood-opacity=".08"/>
    </filter>
    <mask id="mark-cut-large" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240">
      <rect width="240" height="240" fill="white"/>
      <circle cx="82.5" cy="120" r="18.75" fill="black"/>
    </mask>
    <mask id="mark-cut-small" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="white"/>
      <circle cx="22" cy="32" r="5" fill="black"/>
    </mask>
    <g id="mark-large" mask="url(#mark-cut-large)" fill="none" stroke-linecap="round" stroke-width="37.5">
      <path d="M56.25 30V210" class="stem"/>
      <path d="M90 110.6L176.25 33.75" class="arm"/>
      <path d="M90 129.4L176.25 206.25" class="arm"/>
    </g>
    <g id="mark-large-dark" mask="url(#mark-cut-large)" fill="none" stroke-linecap="round" stroke-width="37.5">
      <path d="M56.25 30V210" stroke="#FFFFFF"/>
      <path d="M90 110.6L176.25 33.75" stroke="#7180F5"/>
      <path d="M90 129.4L176.25 206.25" stroke="#7180F5"/>
    </g>
    <g id="mark-small" mask="url(#mark-cut-small)" fill="none" stroke-linecap="round" stroke-width="10">
      <path d="M15 8V56" class="stem"/>
      <path d="M24 29.5L47 9" class="arm"/>
      <path d="M24 34.5L47 55" class="arm"/>
    </g>
    <g id="mark-small-reverse" mask="url(#mark-cut-small)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="10">
      <path d="M15 8V56"/>
      <path d="M24 29.5L47 9"/>
      <path d="M24 34.5L47 55"/>
    </g>
    <style>
      .sans{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
      .label{font-size:18px;font-weight:700;letter-spacing:2.4px;fill:#9297A2}
      .caption{font-size:21px;font-weight:450;fill:#686E79}
      .word{font-size:76px;font-weight:650;letter-spacing:-4px}
      .stem{stroke:#111318}.arm{stroke:#5263D8}
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#F2F3F5"/>
  <text x="100" y="91" class="sans" font-size="24" font-weight="750" fill="#111318" letter-spacing="-.5">aeokit identity / 01</text>
  <text x="1500" y="91" text-anchor="end" class="sans label">MODULAR DEVELOPER TOOLS</text>

  <rect x="80" y="130" width="1440" height="520" rx="34" fill="#FFFFFF" filter="url(#shadow)"/>
  <g transform="translate(155 250) scale(1.22)">
    <use href="#mark-large"/>
  </g>
  <text x="500" y="423" class="sans word"><tspan fill="#111318">aeo</tspan><tspan fill="#5263D8">kit</tspan></text>
  <text x="503" y="478" class="sans caption">One system. Every tool clicks in.</text>
  <line x1="503" y1="523" x2="1415" y2="523" stroke="#EAEBEE" stroke-width="2"/>
  <circle cx="513" cy="573" r="9" fill="#5263D8"/>
  <text x="537" y="580" class="sans caption">The open joint is the brand gesture — a precise place for modules to connect.</text>

  <rect x="80" y="690" width="690" height="300" rx="30" fill="#111318"/>
  <text x="125" y="742" class="sans label" fill="#707684">DARK MODE</text>
  <g transform="translate(126 795) scale(.72)">
    <use href="#mark-large-dark"/>
  </g>
  <text x="325" y="900" class="sans word" font-size="66"><tspan fill="#FFFFFF">aeo</tspan><tspan fill="#7180F5">kit</tspan></text>
  <text x="328" y="941" class="sans" font-size="18" fill="#8E939E">Primary lockup on carbon</text>

  <rect x="810" y="690" width="710" height="300" rx="30" fill="#FFFFFF"/>
  <text x="855" y="742" class="sans label">SYSTEM</text>
  <g transform="translate(865 790)">
    <rect width="96" height="96" rx="24" fill="#F2F3F5"/>
    <g transform="translate(16 16)"><use href="#mark-small"/></g>
  </g>
  <g transform="translate(990 790)">
    <rect width="96" height="96" rx="24" fill="#5263D8"/>
    <g transform="translate(16 16)"><use href="#mark-small-reverse"/></g>
  </g>
  <text x="1120" y="830" class="sans" font-size="39" font-weight="650" letter-spacing="-2"><tspan fill="#111318">aeo</tspan><tspan fill="#5263D8">kit</tspan><tspan fill="#8B909B" font-weight="500" letter-spacing="-1">.dev</tspan></text>
  <text x="1120" y="870" class="sans" font-size="17" fill="#8B909B">Domain lockup</text>
  <g transform="translate(866 914) scale(.5)"><use href="#mark-small"/></g>
  <text x="906" y="941" class="sans" font-size="16" fill="#686E79">32</text>
  <g transform="translate(966 920) scale(.375)"><use href="#mark-small"/></g>
  <text x="997" y="941" class="sans" font-size="16" fill="#686E79">24</text>
  <g transform="translate(1055 923) scale(.28125)"><use href="#mark-small"/></g>
  <text x="1080" y="941" class="sans" font-size="16" fill="#686E79">18</text>
  <line x1="1140" y1="930" x2="1190" y2="930" stroke="#D8DADE" stroke-width="2"/>
  <text x="1210" y="941" class="sans" font-size="16" fill="#686E79">Built to hold at UI scale</text>

  <text x="80" y="1054" class="sans" font-size="18" fill="#8B909B">CARBON #111318</text>
  <text x="292" y="1054" class="sans" font-size="18" fill="#5263D8">COBALT #5263D8</text>
  <text x="1520" y="1054" text-anchor="end" class="sans" font-size="18" fill="#8B909B">aeokit.dev</text>
</svg>
