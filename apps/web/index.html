<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5263d8" />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("theme-preference");
          const dark =
            preference === "dark" ||
            (preference !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark
            ? "openaeo-dark"
            : "openaeo";
        } catch {
          document.documentElement.dataset.theme = "openaeo";
        }
      })();
    </script>
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Track how AI answer engines describe, mention, and cite your brand."
    />
